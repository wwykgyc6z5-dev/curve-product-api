# SonarCloud 설정 파일

# 내 SonarCloud 조직과 프로젝트 이름
sonar.organization=wwykgyc6z5-dev
sonar.projectKey=wwykgyc6z5-dev_curve-product-api

# 검사할 범위 설정 (저장소 전체) 
sonar.sources=.
# 테스트 코드인 tests 폴더는 빼기
sonar.exclusions=tests/**
# 테스트 코드 폴더
sonar.tests=tests

sonar.python.version=3.13
# 테스트 커버리지 결과 파일
sonar.python.coverage.reportPaths=coverage.xml
