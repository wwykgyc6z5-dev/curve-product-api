# =====================================================================
# CI(지속적 통합) 설정 파일
# PR을 올리거나 main에 코드가 합쳐질 때마다 GitHub가 자동으로
# "빌드 → 테스트"를 실행해 줍니다.
# =====================================================================

name: CI

# --- 언제 실행할까? ---------------------------------------------------
on:
  # main으로 가는 PR이 열리거나, PR 새 커밋이 올라올 때
  pull_request:
    branches: [main]
  # main에 코드가 합쳐졌을 때 합친 결과도 한 번 더 확인
  push:
    branches: [main]

jobs:
  test:
    # 화면에 보일 작업 이름
    name: 빌드 및 단위 테스트
    runs-on: ubuntu-latest

    # 순차 실행
    steps:
      # 1) 저장소 코드 내려받기
      - name: 코드 내려받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 2) Python 3.13 설치
      #    cache: pip → 다운로드 받은 라이브러리 캐싱
      - name: Python 설치
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # 3) 필요 라이브러리 설치
      - name: 라이브러리 설치
        run: "pip install --require-hashes --only-binary :all: -r requirements-dev.lock"

      # 4) 빌드: 코드에 문법 오류가 없는지 확인
      - name: 빌드 (문법 검사)
        run: python -m compileall -q app

      # 5) 단위 테스트 실행
      - name: 단위 테스트
        run: pytest -v --cov=app --cov-report=xml

      # 6) 품질 분석: SonarCloud에 코드를 보내 버그·보안 문제·중복 코드를 검사
      - name: 품질 분석 (SonarCloud)
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # image 작업: Docker 이미지 만들기 + 보안 검사 + 저장소에 올리기
  image:
    name: 이미지 빌드 및 취약점 검사
    # test 실패한 코드는 이미지로 만들지 않음
    needs: test
    runs-on: ubuntu-latest

    # 작업에 줄 권한: 코드 읽기 + 이미지 저장소(GHCR)에 올리기
    permissions:
      contents: read
      packages: write

    # 이미지 이름
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      # 1) 저장소 코드 내려받기
      - name: 코드 내려받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 2) Dockerfile로 이미지 만들기
      - name: Docker 이미지 빌드
        run: docker build -t $IMAGE:${{ github.sha }} .

      # 3) Trivy로 이미지 안의 알려진 CVE 검사
      #   하나라도 발생 시 실패 → 아래 단계도 실행 안 됨
      - name: 취약점 검사 (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 4) GHCR 로그인 (main에 머지됐을 때만)
      #    GITHUB_TOKEN → GitHub가 작업마다 자동으로 만들어 주는 임시 열쇠
      - name: GHCR 로그인
        if: github.event_name == 'push'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      # 5) 이미지 올리기 (main에 머지됐을 때만)
      #    태그 2개: 커밋 SHA
      - name: 이미지 올리기 (GHCR)
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest


  # deploy-dev 작업: EC2에 새 이미지 자동 배포
  deploy-dev:
    name: 개발 서버 배포
    # 이미지가 GHCR에 올라간 다음에만 배포
    needs: image
    # main에 머지되었을 때만 (PR 단계에서는 배포 안 함)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # GitHub Environments의 dev 시크릿을 사용
    environment: dev

    steps:
      # 1) SSH 키 준비: 시크릿 → 임시 파일
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 2) 서버에 접속해서 새 이미지로 교체
      - name: 서버에 새 이미지 실행
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" "
            docker pull $IMAGE &&
            (docker rm -f api-dev || true) &&
            docker run -d --name api-dev --restart unless-stopped \
              -p 8080:8000 \
              -e APP_ENV=dev -e APP_VERSION=$TAG \
              $IMAGE
          "

      # 3) 헬스 체크: 2초 간격으로 최대 10번 확인 이후 응답 없을 시 실패
      - name: 배포 확인 (헬스 체크)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" '
            for i in $(seq 1 10); do
              curl -fsS http://localhost:8080/health && exit 0
              sleep 2
            done
            echo "헬스 체크 실패"; exit 1
          '
